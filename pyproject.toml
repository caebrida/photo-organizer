[project]
name = "photo-organizer"
version = "0.1.3"
description = "Organiza fotos e vídeos por data EXIF/XMP, separa duplicadas e gera tags com IA."
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python-headless>=5.0.0.93",
    "pyexiftool>=0.5.6",
    "pyside6-addons>=6.12.0",
    "pyside6-essentials>=6.12.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pillow>=13.0.0",
    "pytest>=8.3",
    "pytest-qt>=4.5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photo_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# os.* com str de propósito: o prefixo \?\ de caminhos longos não passa por Path.
"photo_organizer/core/executor.py" = ["PTH"]
"photo_organizer/ui/icons.py" = ["E501"]  # dados SVG
"scripts/build_translations.py" = ["E501"]  # chaves = textos exatos da interface
